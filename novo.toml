[package]
name        = "att-nv"
version     = "0.1.1"
description = "The Bluetooth Attribute Protocol with no radio: every ATT PDU as a typed value both directions, the MTU exchange, and the attribute-database walk a GATT server performs as arithmetic over a database the caller holds."
license     = "Apache-2.0"

stability   = "experimental"

# `core`: PDUs to and from bytes, and a database walk that is index
# arithmetic over a value the caller owns.  Nothing is read, nothing is
# written, and the server holds no state between requests.
layer       = "core"

category    = "networking"

tags        = ["bluetooth", "ble", "att", "gatt", "attribute-protocol", "codec", "sans-io", "embedded"]
repository  = "https://github.com/novolang/att-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.23.0"

[docs.pages]
"README.md" = "Attributes and their protocol, without a radio"

[dependencies]
# The channel an ATT PDU arrives on.  `frame` and `from_frame` speak
# l2cap-nv's `L2capFrame` so that the two packages share one spelling of
# a channel and a payload rather than each declaring its own.
#
# l2cap-nv comes from the registry at its 0.1.0 release, whose bodies are
# implemented.  Its earlier interface-only 0.0.2 answered every call with
# a panic.
l2cap-nv = "^0.1.0"

[withdrawn]
replaced_by = "ble-codec-nv"
reason      = "The ATT and GATT PDU codecs moved into ble-codec-nv; the noble stack builds on it."
